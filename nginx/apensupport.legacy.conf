###-----------------------------------------
### Python Package Wheel Creator
###-----------------------------------------
    location /whlpull/ {
        alias /var/www/py_apps/piprepo/frontend/;
    }
    location /whlpull/pull {
        proxy_pass http://127.0.0.1:8100/pull;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_redirect off;

        access_log  /var/log/nginx/piprepo_access.log  main;
        error_log   /var/log/nginx/piprepo_error.log   warn;
    }
