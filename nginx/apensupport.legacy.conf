# ──────────────────────────────────────────────────────────────────────
#  apensupport.legacy.conf
#  ────────────────────
#  Backup snapshot of the LIVE legacy nginx config that serves the
#  original static APEN Support site at /var/www/html. Source path on
#  the server: /etc/nginx/conf.d/apensupport.conf
#
#  This file is NOT loaded by nginx from the project folder — it lives
#  here only as a recoverable copy. The deployed config is the one in
#  /etc/nginx/conf.d/apensupport.conf.
#
#  Pulled into the project on 2026-05-18. Re-sync by:
#      cp /etc/nginx/conf.d/apensupport.conf \
#         /var/www/apen_support_nextjs/nginx/apensupport.legacy.conf
# ──────────────────────────────────────────────────────────────────────

# CESC Support to APEN Support redirect
server {
    listen 80;
    server_name cescsupport.blcse.mil;

    return 301 https://apensupport.blcse.mil$request_uri;
}

server {
    listen 443 ssl;
    server_name cescsupport.blcse.mil;

    ssl_certificate /etc/nginx/ssl/apensupport_cui.crt;
    ssl_certificate_key /etc/nginx/ssl/apensupport_cui.key;

    return 301 https://apensupport.blcse.mil$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name apensupport.blcse.mil;

    # Allow direct HTTP access to the CA cert
    location = /certs/cuica.crt {
        root /var/www/html/;
        default_type application/x-x509-ca-cert;
        # Optional: add caching headers
        add_header Cache-Control "public, max-age=86400";
    }

    location = /certs/cuica.pem {
        root /var/www/html/;
        default_type application/x-x509-ca-cert;
        # Optional: add caching headers
        add_header Cache-Control "public, max-age=86400";
    }

    location = /certs/apen_mil-root.crt {
        root /var/www/html/;
        default_type application/x-x509-ca-cert;
        # Optional: add caching headers
        add_header Cache-Control "public, max-age=86400";
    }

    location = /certs/apen_mil-root.pem {
        root /var/www/html/;
        default_type application/x-x509-ca-cert;
        # Optional: add caching headers
        add_header Cache-Control "public, max-age=86400";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Site Settings
server {
    listen 443 ssl;
    server_name apensupport.blcse.mil;

    client_max_body_size 10m;
    client_body_buffer_size 256k;

    disable_symlinks     off;
    autoindex            off;

    # Server-Wide SSL Settings
    ssl_certificate /etc/nginx/ssl/apensupport_cui.crt;
    ssl_certificate_key /etc/nginx/ssl/apensupport_cui.key;

    # Server-Wide ACL Settings
    allow 192.168.0.0/16;
    allow 172.16.0.0/16;
    allow 140.32.70.32/27;     # Adjust to match internal subnet
    allow 140.32.70.64/26;     # Adjust to match internal subnet
    allow 140.32.70.128/27;    # Adjust to match internal subnet
    allow 140.32.71.0/24;      # Adjust to match internal subnet
    deny all;

    access_log /var/log/nginx/cui_nginx_access.log main;
    error_log /var/log/nginx/cui_nginx_error.log warn;

    # Modern TLS settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Cipher list
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Disable Caching
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Security headers
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # add_header X-Frame-Options           "SAMEORIGIN" always;
    # add_header X-Content-Type-Options    "nosniff" always;
    # add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    # add_header X-XSS-Protection          "1; mode=block" always;
    # add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-hashes'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_redirect        off;

    # Default root
    root /var/www/html;

    # Default index filename
    index index.html;

    # Handles the order that NGINX attempts to retrieve the site:
    # First try the URL with no changes
    # Then with the default index filename
    # Then with the default index filename with a / in front
    # Finally, if none are found to have a valid response, serve the configured 404.html page
    try_files $uri $uri/ index =404;

    # Tell Nginx to use /404.html on a 404
    error_page 404 /404.html;

    # Serve the 404 file when requested
    location = /404.html {
    alias /var/www/html/404.html;
    }

    # Main site location (if needed)
    location / {
    }

    location /cran/ {
    alias /mnt/storage/repos/cran/;
    autoindex            on;
    }

    location /evaluate-stig/doc/ {
    autoindex            on;
    }

    location /PDQ/Repository/ {
    autoindex            on;
    }
   
    location /valhalla/ {
    alias /mnt/storage/valhalla/;
    autoindex            on;
    }

    location /logos/ {
    autoindex            on;
    }
