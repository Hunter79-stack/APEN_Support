# /etc/nginx/conf.d/apen_support.conf
#
# Entry point for the apensupport2.blcse.mil site. nginx auto-loads every
# *.conf in /etc/nginx/conf.d/ but does NOT recurse into subdirectories, so
# this one-line loader exists to pull in the actual config from the
# apen_support/ subfolder. All real configuration (server blocks, ACL,
# proxy headers, admin token) lives in /etc/nginx/conf.d/apen_support/.
include /etc/nginx/conf.d/apen_support/*.conf;
