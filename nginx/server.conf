# Hide nginx version from response headers and error pages
server_tokens off;

# ─────────────────────────────────────────────────────────────────────────
# Global Rate Limiting Zones  (read this if you're not an nginx admin)
#
# These lines DEFINE rate-limit "buckets" but don't enforce anything yet — a
# bucket only applies where a `limit_req zone=<name> ...;` line appears inside
# a location block further down. Think of each line below as declaring a speed
# limit; the per-location lines are the actual speed-limit signs on each road.
#
# Anatomy of one line:
#   limit_req_zone  $binary_remote_addr  zone=NAME:SIZE  rate=Nr/s;
#                   └─ who is counted ─┘ └── bucket ──┘  └ how fast ┘
#
#   • $binary_remote_addr — count requests PER CLIENT IP. Each visitor gets
#     their own budget, so one busy user can't use up everyone else's.
#   • zone=NAME — a label the location blocks reference (e.g. apensupport_limit).
#   • :SIZE (e.g. 10m) — RAM reserved to remember recent IPs. 10m ≈ 160k IPs.
#     This is memory, NOT a request count; bigger only matters with many IPs.
#   • rate=Nr/s — the sustained ceiling. 30r/s = 30 requests/second per IP on
#     average. (r/m = per minute, used for rarely-hit endpoints.)
#
# A companion setting, `burst=N` (on the per-location lines), allows a short
# spike of N extra requests above the steady rate before clients get a 429
# "Too Many Requests". A page that loads many assets at once needs the burst
# high enough to cover them, or legit traffic gets throttled.
#
# apensupport_limit is the SITE-WIDE default for normal page/API traffic.
# Raised 10→30 r/s (burst 20→60) because the home page renders ~25 logos plus
# favicon/content-overrides in one burst, which 429'd under the old 10r/s cap.
# ─────────────────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=apensupport_limit:10m rate=30r/s;       # general site + API traffic
limit_req_zone $binary_remote_addr zone=speedtest_upload_limit:20m rate=120r/s;  # speed-test upload chunks (high by design)
limit_req_zone $binary_remote_addr zone=speedtest_download_limit:20m rate=30r/s; # speed-test download chunks
limit_req_zone $binary_remote_addr zone=feedback_limit:5m rate=2r/m;             # feedback/login: 2 per MINUTE, anti-spam/brute-force
limit_req_zone $binary_remote_addr zone=voltron_limit:5m rate=5r/s;              # AI chat proxy (protects the upstream model)
limit_req_zone $binary_remote_addr zone=live_announcements_limit:5m rate=1r/s;   # announcements feed (cached, rarely needs more)

# nginx-module-vts: shared counter zone (per server-zone / upstream / cache
# accounting). Read over loopback by site-stats.mjs for the /admin/ NGINX tab.
#
# These directives live in /etc/nginx/vts.d/ rather than inline, because they
# are only VALID while the VTS module is loaded. The module is hand-built and
# must match nginx's exact version; when it does not, nginx refuses to start
# and the entire site plus every repo goes down (2026-08-10, twice).
#
# nginx-vts-guard.sh runs as ExecStartPre: if the module cannot load it renames
# these files to *.disabled, so nginx starts WITHOUT stats instead of not
# starting at all. A wildcard include that matches nothing is not an error.
# The guard re-enables them automatically once the module matches again.
include /etc/nginx/vts.d/http/*.conf;

# Per-path counters consumed by the Admin NGINX dashboard. Keep these keys in
# sync with HTTP_ZONE_ANNOTATIONS in lib/data/nginx-stats.ts.
map $uri $apen_zone {
    default                    main;
    ~^/speedtest/              speedtest;
    ~^/api/                    api;
    ~^/winget/                 winget;
    ~^/(cran|pip|iso)-control/ mirrors;
}

# Moved pages. The static export used to ship a page.tsx per old URL whose only
# job was a client-side redirect (31 of them, ~3.3 MB of prerendered shell).
# nginx answers those URLs with a 301 instead, in the rewrite phase — before
# auth_request — so nothing is built for them. Exact matches only: files under
# the same prefixes (/vmware/8/x.iso, /isos/x.iso, /repos/piprepo/) are untouched.
# tests/nginx-redirects.test.ts checks every destination still has a page.
map $uri $apen_moved {
    default "";
    /VisualStudio/community                  /downloads/microsoft-products/VisualStudio/community;
    /VisualStudio/community/                 /downloads/microsoft-products/VisualStudio/community;
    /VisualStudio/enterprise                 /downloads/microsoft-products/VisualStudio/enterprise;
    /VisualStudio/enterprise/                /downloads/microsoft-products/VisualStudio/enterprise;
    /VisualStudio                            /downloads/microsoft-products/VisualStudio;
    /VisualStudio/                           /downloads/microsoft-products/VisualStudio;
    /VisualStudio/professional               /downloads/microsoft-products/VisualStudio/professional;
    /VisualStudio/professional/              /downloads/microsoft-products/VisualStudio/professional;
    /color-picker                            /applications/color-picker;
    /color-picker/                           /applications/color-picker;
    /evaluate-stig/documents                 /docs/evaluate-stig/documents;
    /evaluate-stig/documents/                /docs/evaluate-stig/documents;
    /evaluate-stig/enterprise-linux          /docs/evaluate-stig/linux/enterprise;
    /evaluate-stig/enterprise-linux/         /docs/evaluate-stig/linux/enterprise;
    /evaluate-stig                           /security/evaluate-stig;
    /evaluate-stig/                          /security/evaluate-stig;
    /evaluate-stig/ubuntu                    /docs/evaluate-stig/linux/ubuntu;
    /evaluate-stig/ubuntu/                   /docs/evaluate-stig/linux/ubuntu;
    /isos/enterprise-linux                   /downloads/iso/linux/enterprise;
    /isos/enterprise-linux/                  /downloads/iso/linux/enterprise;
    /isos                                    /downloads/iso;
    /isos/                                   /downloads/iso;
    /isos/ubuntu                             /downloads/iso/linux/ubuntu;
    /isos/ubuntu/                            /downloads/iso/linux/ubuntu;
    /isos/windows                            /downloads/iso/windows;
    /isos/windows/                           /downloads/iso/windows;
    /microsoft-products/office               /downloads/microsoft-products/office;
    /microsoft-products/office/              /downloads/microsoft-products/office;
    /microsoft-products                      /downloads/microsoft-products;
    /microsoft-products/                     /downloads/microsoft-products;
    /microsoft-products/store                /downloads/microsoft-products/store;
    /microsoft-products/store/               /downloads/microsoft-products/store;
    /mssoftware                              /downloads/microsoft-products;
    /mssoftware/                             /downloads/microsoft-products;
    /repos/deb                               /docs/repos/deb;
    /repos/deb/                              /docs/repos/deb;
    /repos                                   /docs/repos;
    /repos/                                  /docs/repos;
    /repos/pip                               /docs/repos/pip;
    /repos/pip/                              /docs/repos/pip;
    /repos/rpm                               /docs/repos/rpm;
    /repos/rpm/                              /docs/repos/rpm;
    /speedtest                               /applications/speedtest;
    /speedtest/                              /applications/speedtest;
    /sqltools                                /downloads/microsoft-products/sqltools;
    /sqltools/                               /downloads/microsoft-products/sqltools;
    /tools/color-picker                      /applications/color-picker;
    /tools/color-picker/                     /applications/color-picker;
    /tools                                   /applications;
    /tools/                                  /applications;
    /tools/speedtest                         /applications/speedtest;
    /tools/speedtest/                        /applications/speedtest;
    /vmware                                  /downloads/vmware;
    /vmware/                                 /downloads/vmware;
    /vmware/tools                            /downloads/vmware/tools;
    /vmware/tools/                           /downloads/vmware/tools;
    /vmware/v7                               /downloads/vmware/v7;
    /vmware/v7/                              /downloads/vmware/v7;
    /vmware/v8                               /downloads/vmware/v8;
    /vmware/v8/                              /downloads/vmware/v8;
    /vmware/v9                               /downloads/vmware/v9;
    /vmware/v9/                              /downloads/vmware/v9;
}

# Named upstreams keep backend traffic grouped in the VTS dashboard.
upstream stats_backend { server 127.0.0.1:8788; }
upstream voltron_llm   { server 127.0.0.1:8787; }
upstream speedtest_py  { server 127.0.0.1:8085; }

# Admin-managed upstreams. The wildcard is a no-op before the first publish.
include /etc/nginx/conf.d/apen_support/managed-http*.conf;

# Redirect HTTP to HTTPS
server {
    listen 80;
    # apensupport.blcse.mil is the post-cutover name; apensupport2.blcse.mil is
    # kept only until its A record is retired. NOTE: the certificate installed
    # 2026-08-07 does NOT carry apensupport2 — drop it here when DNS drops it.
    server_name apensupport.blcse.mil apensupport2.blcse.mil;
    # CRL distribution point over plain HTTP (standard for CDP/CRL; avoids
    # any TLS-revocation recursion). All other HTTP redirects to HTTPS.
    location ^~ /pki/ {
        alias /var/www/pki/;
        autoindex on;
        default_type application/pkix-crl;
    }
    location / { return 301 https://$host$request_uri; }
}

# ── NGINX live status (nginx-module-vts) — loopback only ──
# Dedicated 127.0.0.1 listener so site-stats.mjs reads the VTS JSON regardless
# of which vhost is the :80 default server. Only bound to loopback, so it is
# never reachable off-box; the app reads it via NGINX_VTS_JSON_URL.
server {
    listen 127.0.0.1:8099;
    server_name _;
    access_log off;
    # vhost_traffic_status off — don't count our own status polls as a
    # "127.0.0.1" zone. Toggleable; see the note at the http-level include.
    include /etc/nginx/vts.d/status-server/*.conf;
    location = /status/format/json {
        # With VTS disabled this location has no handler and returns 404,
        # which site-stats.mjs already treats as "stats unavailable".
        include /etc/nginx/vts.d/status-location/*.conf;
    }
    location / { return 404; }
}

# HTTPS server
server {
    listen 443 ssl;
    # HTTP/2: multiplexes all requests over one connection, so the home page's
    # CSS/JS/font/logo burst no longer serialises behind HTTP/1.1's ~6-connection
    # limit. The old `listen ... ssl http2` form is deprecated in nginx ≥1.25.1;
    # this box is 1.30, so the standalone directive is the correct syntax.
    http2 on;
    # See the :80 block.
    server_name apensupport.blcse.mil apensupport2.blcse.mil;

    # Per-path zone keys. Toggleable; see the note at the http-level include.
    include /etc/nginx/vts.d/main-server/*.conf;

    # ── Compression ──────────────────────────────────────────────────────────
    # gzip is commented out in the global nginx.conf, so every text asset in the
    # static export (HTML, the ~162 KB CSS bundle, the JS chunks, search-index
    # /api JSON, SVG) was being served UNCOMPRESSED — Lighthouse's
    # document-latency audit flagged the HTML alone as ~75 KB of avoidable
    # transfer, and the render-blocking CSS compresses by roughly 6×. Enabled
    # here at the vhost level (brotli isn't built into this nginx, so gzip only).
    # Already-compressed binaries (webp/png/jpg/woff2) are deliberately NOT in
    # gzip_types; text/html is always compressed when gzip is on.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/wasm
        application/manifest+json
        image/svg+xml
        font/ttf;

    # Dedicated per-site access log. The site-stats proxy (apen-stats-api)
    # reads this exact file (NGINX_ACCESS_LOG in proxy/.env.local) to build the
    # admin "Site Activity" card. Without this directive the vhost falls through
    # to the global access.log and the card reads an empty cui log -> all zeros.
    access_log /var/log/nginx/cui_nginx_access.log main;

    # SSL certificates — STATIC PATHS ON PURPOSE. Do not reintroduce variables
    # here ($ssl_server_name-based selection): with a variable, nginx loads the
    # certificate per handshake in the WORKER process (user `nginx`), not once
    # in the master as root. The private keys are 0600 root:root, so every
    # handshake then fails and the site serves nothing over 443 (verified the
    # hard way on 2026-08-04).
    #
    # Multi-SAN certificate reissued 2026-08-07 by APENBLCSECUICA1-RootCA-Issuing
    # (RSA 4096 / sha256) for the post-cutover addresses. SANs: apensupport
    # .blcse.mil, apensupport, cescsupport.blcse.mil, 172.16.2.19, 140.32.70.91,
    # 140.32.71.91, 127.0.0.1 — the IPs the site actually answers on now; the
    # previous cert still listed the peer's .81/.93/172.16.2.18. It does NOT
    # cover apensupport2.blcse.mil, which is still in server_name above.
    # The .crt holds leaf + issuing CA so clients missing the CA still chain.
    ssl_certificate     /etc/nginx/ssl/apensupport-multi.crt;
    ssl_certificate_key /etc/nginx/ssl/apensupport-multi.key;

    # TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Site-wide login gate ──────────────────────────────────────────────
    # Every location under this server requires SOME valid session (general
    # or admin — see proxy/site-stats.mjs's multi-realm LDAP login) UNLESS it
    # explicitly opts out with `auth_request off;`. auth_request is a scalar
    # directive, so setting it once here is inherited into every location
    # (exact, prefix, and regex alike) automatically — no per-location repeat
    # needed for the ones that SHOULD be gated. /internal/authcheck (below)
    # is the target: a cheap cookie/session-array lookup, no LDAP call.
    #
    # `/admin` and `/api/admin/*` ADDITIONALLY gate themselves via
    # admin-acl.inc (IP allowlist) — that check is unchanged and independent
    # of this one; reaching /admin requires BOTH a general-or-admin session
    # here AND an allowlisted IP there, and admin API WRITES additionally
    # require the session to be admin-kind (authorizeAdmin in site-stats.mjs).
    auth_request /internal/authcheck;
    auth_request_set $auth_user $upstream_http_x_user;

    location = /internal/authcheck {
        internal;
        auth_request off;
        # An auth subrequest inherits the PARENT request's Content-Length but is
        # size-checked against THIS location's limit, not the parent's. Without
        # this line a 140 MB POST to /api/admin/file-upload (client_max_body_size 0)
        # still tripped the 1 MiB default here: the subrequest 413s, and
        # auth_request reports any unexpected status to the client as a bare 500
        # ("auth request unexpected status: 413" in error.log). The subrequest
        # sends no body of its own, so lifting the cap costs nothing.
        client_max_body_size 0;
        proxy_pass http://stats_backend/internal/authcheck;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # Defines $admin_api_token from .env.local; injected into /api/admin/*
    # below. Regenerate via proxy/sync-nginx-admin-token.sh when .env changes.
    include /etc/nginx/conf.d/apen_support/admin-token.inc;

    # OCSP stapling disabled — internal CA.
    ssl_stapling off;
    ssl_stapling_verify off;

    # Merge security headers into child locations that set their own Cache-Control.
    # Requires nginx >= 1.29.3; this deployment uses nginx 1.30.
    add_header_inherit merge;
    include /etc/nginx/conf.d/apen_support/security-headers.inc;

    root /var/www/apen_support_nextjs/out;
    index index.html;
    # Old page URLs (see the $apen_moved map above).
    if ($apen_moved) { return 301 $apen_moved$is_args$args; }
    # Notice/licence .txt files contain UTF-8; without this nginx sends text/plain with no charset.
    charset utf-8;

    error_page 403 /403/index.html;
    error_page 404 /404/index.html;

    # A 401 from the site-wide gate must be able to render these error pages
    # without itself requiring a login — otherwise an unauthenticated visitor
    # who hits a 404 gets bounced into a redirect loop instead of seeing it.
    location ^~ /403/ {
        auth_request off;
        allow all;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ^~ /404/ {
        auth_request off;
        allow all;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Admin routes return 404 (not 403) to non-allowlisted IPs so the routes
    # don't advertise themselves. Same pattern on every /api/* admin block.
    # ALSO sits behind the site-wide gate (no auth_request off here) — reaching
    # this page requires a general-or-admin session AND an allowlisted IP.
    location /admin {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        include /etc/nginx/conf.d/apen_support/login-redirect.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # UI-behavior mock previews (/test/) — gated identically to /admin so they
    # return 404 to non-allowlisted IPs and stay off the public surface.
    location /test {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        include /etc/nginx/conf.d/apen_support/login-redirect.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- API Proxies ---
    location = /api/voltron-chat {
        # 16m to match proxy/voltron-proxy.mjs's MAX_BODY_BYTES — large file
        # attachments (up to the 10 MB attachment cap) are read here.
        client_max_body_size 16m;
        limit_req zone=voltron_limit burst=10 nodelay;
        limit_req_status 429;
        # MUST stay pointed at the local voltron-proxy Node service (not
        # directly at voltron.apen.mil): the proxy is what adds the
        # Authorization bearer token, injects the site-grounding system
        # prompt, and now resolves/summarizes file attachments. Proxying
        # straight to the upstream API skips all of that and would also fail
        # auth (nginx never attaches the bearer token itself).
        proxy_pass http://voltron_llm/api/voltron-chat;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
        proxy_read_timeout 300s;
    }

    location = /api/site-feedback {
        client_max_body_size 64k;
        limit_req zone=feedback_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://stats_backend/api/site-feedback;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/live-announcements {
        limit_req zone=live_announcements_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://stats_backend/api/live-announcements;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # Package-mirror "last updated" stamps shown on the /docs/repos pages.
    location = /api/repo-freshness {
        limit_req zone=live_announcements_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://stats_backend/api/repo-freshness;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # Server-side redirector — Real URLs come from
    # EXTERNAL_URL_* env vars; unknown keys 404 (no enumeration).
    location ^~ /api/external/ {
        proxy_pass http://stats_backend;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
        proxy_intercept_errors on;
    }

    # Cert Request Wizard backend (CES/CEP scaffolding). Returns 503 from
    # every sub-route except /status until CERT_REQUEST_* env vars are set.
    location ^~ /api/cert-request/ {
        proxy_pass http://stats_backend;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # Public read endpoint — every visitor's page mount layers admin
    # content-overrides + custom-page list on top of the static export.
    # No IP gate, no login gate: this must work for end-users (including on
    # the login page itself), not just admins. The corresponding admin WRITE
    # endpoint is /api/admin/content-overrides below, which IS gated.
    location = /api/content-overrides {
        auth_request off;
        # burst=60 covers a page's asset spike, served immediately; over = 429.
        limit_req zone=apensupport_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://stats_backend/api/content-overrides;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/notification-settings {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        proxy_pass http://stats_backend/api/notification-settings;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/acknowledged-alerts {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        proxy_pass http://stats_backend/api/acknowledged-alerts;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # NOTE: dismissals live at /api/admin/dismissed-alerts and are handled by
    # the `location ^~ /api/admin/` block below (IP allowlist + admin-token
    # injection), so no dedicated location is needed here.

    location = /api/system-event {
        limit_req zone=feedback_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://stats_backend/api/system-event;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # A user's own chat transcript (read + upsert). NOT exempted from the
    # site-wide login gate — you must be signed in to have a transcript at
    # all. Admin-wide read/delete for the audit view is handled by the
    # existing `location ^~ /api/admin/` block below.
    location = /api/chat-history {
        client_max_body_size 256k;
        limit_req zone=apensupport_limit burst=20 nodelay;
        proxy_pass http://stats_backend/api/chat-history;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/site-stats {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        proxy_pass http://stats_backend/api/site-stats;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # Multi-realm LDAP-bound session login. These four are deliberately NOT
    # gated by admin-acl.inc (unlike before) — every visitor must be able to
    # reach them to log in at all; admin CAPABILITY is still enforced
    # separately (session kind + the IP allowlist on /admin and
    # /api/admin/* below). All four also carry `auth_request off;` since you
    # must be able to reach them BEFORE having a session.
    location = /api/auth/realms {
        auth_request off;
        limit_req zone=apensupport_limit burst=10 nodelay;
        proxy_pass http://stats_backend/api/auth/realms;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/auth/login {
        auth_request off;
        limit_req zone=feedback_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://stats_backend/api/auth/login;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/auth/logout {
        auth_request off;
        proxy_pass http://stats_backend/api/auth/logout;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    location = /api/auth/whoami {
        auth_request off;
        proxy_pass http://stats_backend/api/auth/whoami;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
    }

    # Product-file uploads (ISO / EXE / MSI) from /admin#content. An exact-match
    # location, so it wins over the `^~ /api/admin/` prefix block below.
    #
    # Three settings matter here and nowhere else:
    #   client_max_body_size 0      — no cap. ISOs run 2–15 GB; the 6m on the
    #                                 admin prefix block is sized for icons.
    #   proxy_request_buffering off — stream to the proxy as bytes arrive. With
    #                                 buffering ON nginx first spools the ENTIRE
    #                                 body into its temp dir (on /), filling the
    #                                 root filesystem and stalling the progress
    #                                 bar at 100% for minutes.
    #   *_timeout 3600s             — a 15 GB transfer over a slow link legitimately
    #                                 runs for an hour; the 60s defaults kill it.
    # The proxy writes to `.<name>.upload-part` and the client resumes from the
    # stored offset, so even a timeout costs a retry rather than the whole file.
    location = /api/admin/file-upload {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        # NOTE: no proxy_http_version here — proxy-headers.inc already sets 1.1,
        # and nginx rejects the duplicate outright ("directive is duplicate",
        # emerg, config test fails). Everything below is absent from that
        # include, so it layers on top rather than colliding.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        proxy_pass http://stats_backend;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
        # Server-side token injection; overrides any client-supplied value.
        proxy_set_header x-admin-token $admin_api_token;
    }

    location ^~ /api/admin/ {
        include /etc/nginx/conf.d/apen_support/admin-acl.inc;
        error_page 403 =404 /404.html;
        # Route-image uploads are capped and signature-validated by the proxy
        # at 6 MiB. Nginx's 1 MiB default would reject them before Admin sees
        # the proxy's useful validation response.
        client_max_body_size 6m;
        proxy_pass http://stats_backend;
        include /etc/nginx/conf.d/apen_support/proxy-headers.inc;
        # Server-side token injection; overrides any client-supplied value.
        proxy_set_header x-admin-token $admin_api_token;
    }

    # --- Speedtest (Python backend, PM2 app "apen-speedtest" on :8090) ---
    # Replaced the LibreSpeed PHP-FPM backend (which had been 502ing on a
    # socket-permission mismatch). The Python service serves both its own
    # frontend and the measurement API under /speedtest/.
    #
    # X-Forwarded-For is set to $remote_addr (overwrite, NOT append): the
    # backend authorizes clients by the FIRST address in that header, so an
    # appended/forwarded value would let clients spoof an authorized IP.
    # --- Speedtest ---
    # The measurement API is the SAME backend instance the legacy site
    # (apensupport.blcse.mil) uses: the FastAPI/uvicorn container on :8083.
    # One backend, two sites — results and the completion report are
    # identical on both by construction.
    #
    # NO limit_req here: the download phase runs 4 parallel streams of 4 MiB
    # requests, so any fixed rate both caps the measurable throughput and
    # 429s mid-test. The backend gates measurement endpoints to authorized
    # networks itself; X-Forwarded-For is set to $remote_addr (overwrite,
    # NOT append) because the backend authorizes the FIRST address in that
    # header — an appended value would let clients spoof an authorized IP.

    ###-----------------------------------------
    ### speed test sites
    ###-----------------------------------------
    # Exempted from the site-wide login gate: the measurement client/report
    # viewer predates general login and the backend already self-gates
    # measurement endpoints to authorized networks by IP. Revisit if/when
    # these get their own auth story.
    location = /speedtest { auth_request off; return 301 /speedtest/; }

    location = /speedtest/api/download {
        auth_request off;
        proxy_pass         http://speedtest_py/speedtest/api/download;
        limit_req zone=speedtest_download_limit burst=20 nodelay;
        limit_req_status 429;
    }

    location = /speedtest/api/upload {
        auth_request off;
        proxy_pass         http://speedtest_py/speedtest/api/upload;
        limit_req zone=speedtest_upload_limit burst=20 nodelay;
        limit_req_status 429;
    }

    # Everything else: UI, static, api, report (strip prefix).
    location /speedtest/ {
        auth_request off;
        proxy_pass         http://speedtest_py/speedtest/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /speedtest;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-cache" always;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    location = /netdiag { auth_request off; return 301 /netdiag/; }

    # WebSocket: live UI feed + agent connections (strip prefix, keep /ws/).
    # Exempted like /speedtest/ above — non-browser diagnostic agents connect
    # here directly and have no way to obtain a session cookie.
    location /netdiag/ws/ {
        auth_request off;
        proxy_pass         http://speedtest_py/netdiag/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /netdiag;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else: UI, static, api, report (strip prefix).
    location /netdiag/ {
        auth_request off;
        proxy_pass         http://140.32.71.81:8085/netdiag/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /netdiag;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-cache" always;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /network-analysis { auth_request off; return 301 /network-analysis/; }

    # NetDiag WebSocket (strip prefix, keep /netdiag/ws/). Exempted like
    # /netdiag/ws/ above.
    location /network-analysis/netdiag/ws/ {
        auth_request off;
        proxy_pass         http://speedtest_py/netdiag/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /network-analysis;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else: shell, Speed Test tab + streamed transfers, NetDiag UI/API/report.
    location /network-analysis/ {
        auth_request off;
        proxy_pass         http://speedtest_py/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /network-analysis;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-cache" always;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static Asset Caching ---
    # Exempted: the login page's own JS/CSS/font bundle must load BEFORE an
    # anonymous visitor has a session, or the login form itself can't render.
    location ^~ /_next/static/ {
        auth_request off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        auth_request off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /search-index.json {
        auth_request off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Product logos — the home page renders ~25 of these in one burst, which
    # alone exceeds apensupport_limit (10r/s, burst=20) and 429'd both the
    # images and collateral requests (favicon, /api/content-overrides). Static
    # imagery doesn't need request-rate DoS protection, so exempt /logos/ from
    # limit_req and cache it. Served from the static export, falling back to
    # @legacy_logos (its OWN fallback, not the gated @legacy_files — a
    # try_files fallback to a named location re-runs the access phase using
    # THAT location's settings, not the caller's, so sharing @legacy_files
    # here would silently un-exempt any logo served from the legacy webroot —
    # exactly the asset needed to render the login page for an anonymous
    # visitor). Also exempted from the site-wide login gate for the same
    # reason as the static asset locations above.
    location ^~ /logos/ {
        auth_request off;
        try_files $uri $uri/ @legacy_logos;
        # Brand/product logos change rarely. Bumped 7d → 30d (Lighthouse flagged
        # the short lifetime as ~280 KB of avoidable repeat-visit transfer).
        # Kept revalidatable (not `immutable`) since these filenames aren't
        # content-hashed, so an occasional logo swap still propagates.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location @legacy_logos {
        auth_request off;
        root /var/www/html;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # Two-segment paths like /tools/my-tool fall through to the
    # /custom-pages/ renderer when no static file matches. Real sub-routes
    # like /vmware/v9/ still win because try_files checks disk first.
    # Under the site-wide gate like any other page (login-redirect.inc).
    location ~ ^/[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_-]*/?$ {
        limit_req_status 429;
        # burst=60 covers a page's asset spike, served immediately; over = 429.
        limit_req zone=apensupport_limit burst=60 nodelay;
        include /etc/nginx/conf.d/apen_support/login-redirect.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html /custom-pages/index.html;
    }

    # ── CUI WinGet REST source ──────────────────────────
    # Reverse-proxy to the online WinGet repo server (apenwingetrepo.blcse.mil,
    # 172.16.2.22) so internal workstations get a same-origin catalog +
    # installer path. Host is pinned to the upstream vhost (the shared
    # proxy-headers.inc would send Host=$host, the wrong name), so this block
    # sets headers explicitly. Upstream uses an internal CA; nginx does not
    # verify proxied TLS by default and proxy_ssl_server_name sends SNI.
    location ^~ /winget/api/ {
        auth_request off;
        proxy_pass https://apenwingetrepo.blcse.mil/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host              apenwingetrepo.blcse.mil;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";   # let sub_filter rewrite uncompressed JSON
        # Catalog/manifest InstallerUrls are root-relative (/packages/...);
        # rewrite to the proxied prefix so clients fetch them back through this host.
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter "/packages/" "/winget/packages/";
    }
    location ^~ /winget/packages/ {
        auth_request off;
        proxy_pass https://apenwingetrepo.blcse.mil/packages/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host              apenwingetrepo.blcse.mil;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream large MSIX/AppX installers
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }

    # Friendly download route — resolves /winget/get/<PackageIdentifier> to the
    # installer on the online repo (which streams it), so the store page links to
    # clean IDs instead of the full /winget/packages/<folder>/<file> path.
    location ^~ /winget/get/ {
        auth_request off;
        proxy_pass https://apenwingetrepo.blcse.mil/api/download/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host              apenwingetrepo.blcse.mil;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream large MSIX/AppX installers
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }

    # CRL distribution point (also reachable over HTTPS). Must stay public —
    # consumed by certificate validators, not browsers with a session.
    location ^~ /pki/ {
        auth_request off;
        alias /var/www/pki/;
        autoindex on;
        default_type application/pkix-crl;
    }

    # The login page itself — must be reachable by a visitor who has no
    # session at all yet. login-redirect.inc (used by the gated locations
    # above) points a 401 here.
    location /login/ {
        auth_request off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- Main App Routing ---
    location / {
        limit_req_status 429;
        # burst=60 covers a page's asset spike, served immediately; over = 429.
        limit_req zone=apensupport_limit burst=60 nodelay;
        include /etc/nginx/conf.d/apen_support/login-redirect.inc;
        # Revalidate exported pages without leaking no-cache into immutable
        # asset locations through add_header_inherit merge.
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Serve the static export first; anything not in it (download files,
        # repo .list/.gpg/.repo artifacts, ISOs, installers, certs, and any
        # legacy page not yet ported) falls back to the existing /var/www/html
        # tree so nothing 404s when the old site host is retired.
        try_files $uri $uri.html $uri/index.html @legacy_files;
    }

    # ── Installer trees the guides fetch with curl/wget ──────────────────────
    # A bare curl carries no session cookie, so behind the site-wide gate the
    # guides' download commands only ever fetched the login page. These FILE
    # trees accept either a logged-in session or a client inside the subnets
    # listed in installer-download.inc (satisfy any). Exact trees only: the
    # /trellix and /dren/trellix guide PAGES stay login-only. The old
    # /evaluate-stig page URLs are 301'd by the $apen_moved map before this.
    location ^~ /evaluate-stig/                          { include /etc/nginx/conf.d/apen_support/installer-download.inc; }
    location ^~ /trellix/installer/                      { include /etc/nginx/conf.d/apen_support/installer-download.inc; }
    location =  /trellix/cui-trellix-install.tar.gz      { include /etc/nginx/conf.d/apen_support/installer-download.inc; }
    location ^~ /dren/trellix/installer/                 { include /etc/nginx/conf.d/apen_support/installer-download.inc; }
    location =  /dren/trellix/dren-trellix-install.tar.gz { include /etc/nginx/conf.d/apen_support/installer-download.inc; }

    # Legacy file/asset fallback — serves the old webroot for any path the new
    # static export doesn't provide. Download links across the site point here
    # via APENSUPPORT_BASE (apensupport2). Update the root if the file tree moves.
    location @legacy_files {
        root /var/www/html;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # CRAN Mirror Control panel (FastAPI + SSE on 127.0.0.1:8080)
    location = /cran-control { return 301 /cran-control/; }

    location /cran-control/ {
        include /etc/nginx/conf.d/apen_support/blocked-hosts.inc;
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;

        # SSE (live sync feed): stream chunks, don't batch or cache.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;                # a full cran-sync can run >1h; don't cut it
        proxy_send_timeout 3600s;
    }

    ###-----------------------------------------
    ### cran handler
    ###-----------------------------------------
    # ^~ (not a plain prefix) — the two-segment custom-pages regex catch-all
    # would otherwise shadow bare top-level paths here (/cran/bin/, /cran/web/,
    # etc. are all exactly two segments); ^~ always wins over a regex, which a
    # plain prefix location does not. Exempted: CRAN/apt-style mirror clients,
    # not browsers with a session.
    location ^~ /cran/ {
    auth_request off;
    alias /mnt/storage/repos/cran/;
    autoindex            on;
    }

    # PIP Mirror Control panel (FastAPI + SSE on 127.0.0.1:8081)
    location = /pip-control { return 301 /pip-control/; }

    location /pip-control/ {
        include /etc/nginx/conf.d/apen_support/blocked-hosts.inc;
        proxy_pass         http://127.0.0.1:8081/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;

        # SSE (live sync feed): stream chunks, don't batch or cache.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;                # a full pip-sync can run >1h; don't cut it
        proxy_send_timeout 3600s;
    }

    ###-----------------------------------------
    ### piprepo handler
    ###-----------------------------------------
    # ^~ for the same reason as /cran/ above — otherwise the two-segment
    # custom-pages regex catch-all shadows the bare /repos/piprepo/ path.
    # Package-mirror tree (/repos/rpm, /repos/deb, /repos/cran, /repos/keys).
    #
    # auth_request off is MANDATORY here, not a convenience: apt, dnf and R
    # cannot log in. Under the site-wide gate these paths returned the /login/
    # page with a 200 status, so package managers received HTML where they
    # expected InRelease/repomd.xml/PACKAGES — and the health probe read the
    # same 200 and reported the node green while the mirror was unusable.
    #
    # ^~ (not a plain prefix) for the reason given on /cran/ below: the
    # two-segment custom-pages regex would otherwise capture "/repos/cran"
    # (no trailing slash) and render the not-found page.
    #
    # root, not alias — /repos/piprepo is a symlink into /mnt/storage and the
    # longer ^~ /repos/piprepo/ prefix below still wins for that subtree.
    # The legacy webroot still holds pre-cutover landing pages at
    # /var/www/html/repos/{rpm,deb,pip}/index.html. Under `^~ /repos/` below
    # nginx serves those, so typing the bare directory in a browser renders the
    # OLD site. Exact `=` matches outrank `^~`, and they match ONLY the bare
    # directory URI — apt/dnf/pip subpaths such as /repos/deb/ubuntu/dists/...
    # never hit these, so package managers are unaffected.
    location = /repos/rpm/ { auth_request off; return 301 /docs/repos/rpm; }
    location = /repos/deb/ { auth_request off; return 301 /docs/repos/deb; }
    location = /repos/pip/ { auth_request off; return 301 /docs/repos/pip; }
    location = /repos/rpm  { auth_request off; return 301 /docs/repos/rpm; }
    location = /repos/deb  { auth_request off; return 301 /docs/repos/deb; }
    location = /repos/pip  { auth_request off; return 301 /docs/repos/pip; }

    location ^~ /repos/ {
        auth_request off;
        root /var/www/html;
        autoindex on;
        # Package managers are not browsers. The site-wide 404 page is ~50 KB of
        # HTML; serving it here means any tool that does not check status codes
        # writes that HTML to disk. On 2026-08-10 a client's sources.list became
        # "<!DOCTYPE ..." exactly this way and apt refused to run at all
        # ("Type '<!DOCTYPE' is not known on line 1"). One failed apt run also
        # pulled 15 x 50 KB of error pages. Same reasoning as the auth_request
        # note above: this tree is consumed by machines, so failures must be
        # small, plain, and unambiguous.
        error_page 404 = @repo_404;
    }

    location @repo_404 {
        auth_request off;
        default_type text/plain;
        return 404 "404 Not Found\n";
    }

    location ^~ /repos/piprepo/ {
        auth_request off;
        # root, NOT the inherited static-export root: /repos/piprepo is a
        # symlink in the legacy webroot pointing at
        # /mnt/storage/repos/pip/wheels/simple. Without this the block fell
        # through to out/repos/piprepo/, which does not exist — every request
        # 404'd (1891 times on 2026-08-07 alone) and the repo-pip health node
        # reported degraded.
        root /var/www/html;
        autoindex on;
    }

    # ISO Mirror Control panel (FastAPI + SSE on 127.0.0.1:8082)
    location = /iso-control { return 301 /iso-control/; }

    location /iso-control/ {
        include /etc/nginx/conf.d/apen_support/blocked-hosts.inc;
        proxy_pass         http://127.0.0.1:8082/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;

        # SSE (live sync feed): stream chunks, don't batch or cache.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;                # a full iso-sync can run >1h; don't cut it
        proxy_send_timeout 3600s;
    }

    # Admin-managed locations. The wildcard is a no-op before the first publish.
    include /etc/nginx/conf.d/apen_support/managed-loc*.conf;

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
    }
}
