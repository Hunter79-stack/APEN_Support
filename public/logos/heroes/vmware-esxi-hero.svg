<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030e08"/>
      <stop offset="50%" stop-color="#07180f"/>
      <stop offset="100%" stop-color="#0a1e1a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78be20" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#78be20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0091da" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0091da" stop-opacity="0"/>
    </radialGradient>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="layerGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78be20" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78be20" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0091da" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0091da" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="layerGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c1d5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00c1d5" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#glow1)"/>
    <rect width="900" height="280" fill="url(#glow2)"/>

    <!-- Dot grid -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <rect width="900" height="280" fill="url(#dots)"/>

    <!-- ── RIGHT SIDE: Hypervisor layer stack visualization ── -->
    <!-- Physical server layer (bottom) -->
    <rect x="570" y="198" width="280" height="38" rx="6" fill="url(#layerGrad2)" opacity="0.9"/>
    <text x="710" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.7" letter-spacing="1.5">PHYSICAL SERVER</text>
    <!-- Server detail marks -->
    <rect x="580" y="206" width="16" height="8" rx="2" fill="#0091da" opacity="0.5"/>
    <rect x="602" y="206" width="16" height="8" rx="2" fill="#0091da" opacity="0.3"/>

    <!-- ESXi Hypervisor layer (middle, highlighted) -->
    <rect x="570" y="150" width="280" height="38" rx="6" fill="#78be20" opacity="0.22"/>
    <rect x="570" y="150" width="280" height="38" rx="6" fill="none" stroke="#78be20" stroke-width="1.5" opacity="0.6" filter="url(#lineGlow)"/>
    <text x="710" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#78be20" text-anchor="middle" letter-spacing="1.5">ESXi HYPERVISOR</text>
    <circle cx="844" cy="169" r="5" fill="#78be20" opacity="0.7"/>
    <circle cx="830" cy="169" r="5" fill="#78be20" opacity="0.4"/>

    <!-- VM layer labels (top section) -->
    <!-- VM 1 -->
    <rect x="570" y="80" width="82" height="58" rx="5" fill="url(#layerGrad3)" opacity="0.8"/>
    <rect x="570" y="80" width="82" height="58" rx="5" fill="none" stroke="#00c1d5" stroke-width="1" opacity="0.4"/>
    <text x="611" y="106" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.7">VM 1</text>
    <rect x="578" y="112" width="28" height="4" rx="2" fill="#00c1d5" opacity="0.4"/>
    <rect x="578" y="120" width="20" height="4" rx="2" fill="#00c1d5" opacity="0.3"/>

    <!-- VM 2 -->
    <rect x="661" y="80" width="82" height="58" rx="5" fill="url(#layerGrad3)" opacity="0.8"/>
    <rect x="661" y="80" width="82" height="58" rx="5" fill="none" stroke="#00c1d5" stroke-width="1" opacity="0.4"/>
    <text x="702" y="106" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.7">VM 2</text>
    <rect x="669" y="112" width="28" height="4" rx="2" fill="#00c1d5" opacity="0.4"/>
    <rect x="669" y="120" width="20" height="4" rx="2" fill="#00c1d5" opacity="0.3"/>

    <!-- VM 3 -->
    <rect x="752" y="80" width="82" height="58" rx="5" fill="url(#layerGrad3)" opacity="0.8"/>
    <rect x="752" y="80" width="82" height="58" rx="5" fill="none" stroke="#00c1d5" stroke-width="1" opacity="0.4"/>
    <text x="793" y="106" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.7">VM 3</text>
    <rect x="760" y="112" width="28" height="4" rx="2" fill="#00c1d5" opacity="0.4"/>
    <rect x="760" y="120" width="20" height="4" rx="2" fill="#00c1d5" opacity="0.3"/>

    <!-- Connect VMs down to hypervisor layer -->
    <line x1="611" y1="138" x2="611" y2="150" stroke="#00c1d5" stroke-width="1" opacity="0.3"/>
    <line x1="702" y1="138" x2="702" y2="150" stroke="#00c1d5" stroke-width="1" opacity="0.3"/>
    <line x1="793" y1="138" x2="793" y2="150" stroke="#00c1d5" stroke-width="1" opacity="0.3"/>
    <!-- Connect hypervisor to server -->
    <line x1="710" y1="188" x2="710" y2="198" stroke="#0091da" stroke-width="1.5" opacity="0.4"/>

    <!-- ── VERTICAL DIVIDER ── -->
    <line x1="520" y1="40" x2="520" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- ── LEFT SIDE: Text content ── -->
    <text x="60" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" opacity="0.45" letter-spacing="4">VMWARE</text>
    <line x1="60" y1="82" x2="200" y2="82" stroke="#78be20" stroke-width="1.5" opacity="0.5"/>

    <text x="60" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">vSphere</text>
    <text x="60" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="300" fill="#ffffff" letter-spacing="-0.5" opacity="0.85">Hypervisor</text>

    <rect x="60" y="196" width="76" height="26" rx="13" fill="#78be20" opacity="0.16" stroke="#78be20" stroke-width="1" stroke-opacity="0.45"/>
    <text x="98" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#78be20" text-anchor="middle" letter-spacing="1">ESXi</text>

    <text x="60" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" opacity="0.35" letter-spacing="1.5">BARE-METAL HYPERVISOR  ·  TYPE 1</text>

    <!-- Accent bar -->
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78be20"/>
      <stop offset="100%" stop-color="#0091da"/>
    </linearGradient>
    <rect x="40" y="110" width="4" height="78" rx="2" fill="url(#accentBar)"/>
  </g>
</svg>
