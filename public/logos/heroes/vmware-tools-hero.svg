<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#09122a"/>
      <stop offset="100%" stop-color="#0e1935"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#0091da" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0091da" stop-opacity="0"/>
    </radialGradient>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#glow1)"/>
    <rect width="900" height="280" fill="url(#glow2)"/>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <rect width="900" height="280" fill="url(#dots)"/>

    <!-- ── RIGHT SIDE: Gear + connector visualization ── -->
    <!-- Large gear body -->
    <circle cx="710" cy="140" r="55" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35" filter="url(#lineGlow)"/>
    <circle cx="710" cy="140" r="38" fill="#6366f1" opacity="0.10"/>
    <circle cx="710" cy="140" r="18" fill="#6366f1" opacity="0.25"/>
    <circle cx="710" cy="140" r="8"  fill="#6366f1" opacity="0.6"/>

    <!-- Gear teeth (8 teeth using rotated rects) -->
    <g transform="rotate(0, 710, 140)">   <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(45, 710, 140)">  <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(90, 710, 140)">  <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(135, 710, 140)"> <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(180, 710, 140)"> <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(225, 710, 140)"> <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(270, 710, 140)"> <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>
    <g transform="rotate(315, 710, 140)"> <rect x="702" y="76" width="16" height="22" rx="4" fill="#6366f1" opacity="0.55"/></g>

    <!-- Smaller orbiting gear -->
    <circle cx="800" cy="88" r="24" fill="none" stroke="#0091da" stroke-width="1.2" opacity="0.4"/>
    <circle cx="800" cy="88" r="10" fill="#0091da" opacity="0.15"/>
    <circle cx="800" cy="88" r="5"  fill="#0091da" opacity="0.4"/>
    <g transform="rotate(30, 800, 88)">  <rect x="794" y="58" width="12" height="16" rx="3" fill="#0091da" opacity="0.4"/></g>
    <g transform="rotate(90, 800, 88)">  <rect x="794" y="58" width="12" height="16" rx="3" fill="#0091da" opacity="0.4"/></g>
    <g transform="rotate(150, 800, 88)"> <rect x="794" y="58" width="12" height="16" rx="3" fill="#0091da" opacity="0.4"/></g>
    <g transform="rotate(210, 800, 88)"> <rect x="794" y="58" width="12" height="16" rx="3" fill="#0091da" opacity="0.4"/></g>
    <g transform="rotate(270, 800, 88)"> <rect x="794" y="58" width="12" height="16" rx="3" fill="#0091da" opacity="0.4"/></g>
    <g transform="rotate(330, 800, 88)"> <rect x="794" y="58" width="12" height="16" rx="3" fill="#0091da" opacity="0.4"/></g>

    <!-- Connection between gears -->
    <line x1="755" y1="118" x2="776" y2="100" stroke="#6366f1" stroke-width="1.2" opacity="0.3"/>

    <!-- ── DIVIDER ── -->
    <line x1="520" y1="40" x2="520" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- ── LEFT SIDE: Text content ── -->
    <text x="60" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" opacity="0.45" letter-spacing="4">VMWARE</text>
    <line x1="60" y1="82" x2="200" y2="82" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>

    <text x="60" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Tools &amp;</text>
    <text x="60" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="300" fill="#ffffff" letter-spacing="-0.5" opacity="0.85">VMRC</text>

    <rect x="60" y="196" width="102" height="26" rx="13" fill="#6366f1" opacity="0.16" stroke="#6366f1" stroke-width="1" stroke-opacity="0.45"/>
    <text x="111" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">UTILITIES</text>

    <text x="60" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" opacity="0.35" letter-spacing="1.5">GUEST TOOLS  ·  REMOTE CONSOLE</text>

    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0091da"/>
    </linearGradient>
    <rect x="40" y="110" width="4" height="78" rx="2" fill="url(#accentBar)"/>
  </g>
</svg>
