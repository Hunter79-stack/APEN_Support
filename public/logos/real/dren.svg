<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c2a4a"/>
      <stop offset="100%" stop-color="#06172a"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Central hub -->
  <circle cx="48" cy="48" r="7" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="48" cy="48" r="3" fill="#38bdf8"/>
  <!-- Satellite nodes -->
  <circle cx="18" cy="30" r="5" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="78" cy="30" r="5" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="18" cy="66" r="5" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="1.8"/>
  <circle cx="78" cy="66" r="5" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="1.8"/>
  <!-- Connection lines -->
  <line x1="23" y1="32" x2="42" y2="44" stroke="url(#line1)" stroke-width="1.5" opacity="0.8"/>
  <line x1="73" y1="32" x2="54" y2="44" stroke="url(#line1)" stroke-width="1.5" opacity="0.8"/>
  <line x1="23" y1="64" x2="42" y2="52" stroke="url(#line2)" stroke-width="1.5" opacity="0.7"/>
  <line x1="73" y1="64" x2="54" y2="52" stroke="url(#line2)" stroke-width="1.5" opacity="0.7"/>
  <!-- Data pulses (small dots on lines) -->
  <circle cx="32" cy="38" r="2.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="64" cy="38" r="2.5" fill="#38bdf8" opacity="0.9"/>
  <!-- DREN label -->
  <rect x="32" y="78" width="32" height="10" rx="3" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  <text x="48" y="86" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="8" letter-spacing="2" fill="#38bdf8">DREN</text>
</svg>