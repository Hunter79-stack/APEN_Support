<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="scissor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Dashed selection rectangle -->
  <rect x="10" y="10" width="76" height="56" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- Corner markers -->
  <path d="M10 22 L10 10 L22 10" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M74 10 L86 10 L86 22" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Scissors body -->
  <!-- Left blade -->
  <path d="M34 60 L22 82 A6 6 0 1 0 34 88 L48 66" stroke="url(#scissor)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right blade -->
  <path d="M62 60 L74 82 A6 6 0 1 1 62 88 L48 66" stroke="url(#scissor)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Pivot -->
  <circle cx="48" cy="64" r="5" fill="url(#scissor)"/>
  <circle cx="48" cy="64" r="2" fill="white"/>
  <!-- Pivot handles detail -->
  <circle cx="23.5" cy="86" r="5" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="72.5" cy="86" r="5" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
</svg>