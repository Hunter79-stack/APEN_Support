<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f0ece4"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a259ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0d5"/>
      <stop offset="60%" stop-color="#c8b99a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Paintbrush body (diagonal) -->
  <g transform="rotate(-35 48 48)">
    <rect x="40" y="18" width="14" height="42" rx="4" fill="url(#brush)"/>
    <!-- Ferrule (metal band) -->
    <rect x="39" y="54" width="16" height="6" rx="1" fill="#b0a090"/>
    <!-- Bristles -->
    <path d="M40 60 Q47 76 54 60 Z" fill="url(#bristle)"/>
    <path d="M42 60 Q47 72 52 60" fill="none" stroke="#c8b99a" stroke-width="0.8"/>
  </g>
  <!-- Paint dots — colorful splashes -->
  <circle cx="22" cy="32" r="7" fill="#ff6b6b" opacity="0.9"/>
  <circle cx="20" cy="46" r="5" fill="#ffd166" opacity="0.9"/>
  <circle cx="28" cy="58" r="6" fill="#06d6a0" opacity="0.9"/>
  <circle cx="70" cy="26" r="5" fill="#118ab2" opacity="0.9"/>
  <circle cx="76" cy="40" r="7" fill="#ef476f" opacity="0.9"/>
  <circle cx="72" cy="60" r="5" fill="#ffd166" opacity="0.85"/>
  <!-- Palette arc hint -->
  <path d="M18 72 Q48 84 78 72" fill="none" stroke="#ddd0c4" stroke-width="2" opacity="0.7"/>
</svg>