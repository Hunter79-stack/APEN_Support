<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12104a"/>
      <stop offset="100%" stop-color="#090830"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Terminal window frame -->
  <rect x="10" y="16" width="76" height="64" rx="8" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.4)" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="10" y="16" width="76" height="14" rx="8" fill="rgba(124,58,237,0.2)"/>
  <rect x="10" y="22" width="76" height="8" fill="rgba(124,58,237,0.2)"/>
  <!-- Traffic lights -->
  <circle cx="19" cy="23" r="2.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="27" cy="23" r="2.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="35" cy="23" r="2.5" fill="#22c55e" opacity="0.8"/>
  <!-- Prompt line 1: > symbol + text -->
  <text x="18" y="43" font-family="'JetBrains Mono',monospace" font-size="10" fill="#a78bfa" font-weight="600">PS</text>
  <text x="35" y="43" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(255,255,255,0.5)">C:\&gt;</text>
  <!-- Prompt line 2: command text -->
  <rect x="18" y="50" width="30" height="8" rx="1.5" fill="rgba(124,58,237,0.15)"/>
  <!-- Cursor blink -->
  <rect x="18" y="50" width="2.5" height="8" rx="1" fill="#a78bfa" opacity="0.9"/>
  <!-- Prompt line 3: output (dim) -->
  <line x1="18" y1="66" x2="54" y2="66" stroke="rgba(255,255,255,0.12)" stroke-width="6" stroke-linecap="round"/>
  <line x1="18" y1="74" x2="40" y2="74" stroke="rgba(255,255,255,0.08)" stroke-width="6" stroke-linecap="round"/>
</svg>