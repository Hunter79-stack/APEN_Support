<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#bg)"/>
  <!-- Film reel -->
  <circle cx="48" cy="44" r="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="48" cy="44" r="16" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="2"/>
  <circle cx="48" cy="44" r="7" fill="rgba(0,212,255,0.1)" stroke="url(#reel)" stroke-width="2"/>
  <!-- Spokes -->
  <line x1="48" y1="20" x2="48" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="27.2" y1="31" x2="68.8" y2="57" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="27.2" y1="57" x2="68.8" y2="31" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Center -->
  <circle cx="48" cy="44" r="3.5" fill="url(#reel)"/>
  <!-- HEVC label -->
  <rect x="12" y="74" width="72" height="16" rx="4" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
  <text x="48" y="86" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="9" letter-spacing="1" fill="#00d4ff">HEVC  H.265</text>
</svg>